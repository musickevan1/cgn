name: cgn
channels:
  - pytorch
  - pyg
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pytorch>=2.0.0
  - torchvision
  - torchaudio
  - pytorch-cuda=11.8
  - pyg
  - pip
  - pip:
    - torch-geometric
    - pytorch-lightning
    - hydra-core
    - omegaconf
    - nilearn
    - nibabel
    - networkx
    - scikit-learn
    - pandas
    - matplotlib
    - seaborn
    - plotly
    - scipy
    - tqdm
    - jupyter
    - ipykernel
